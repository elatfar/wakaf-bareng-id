<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Preview Struktur Posisi Sertifikat</title>
<style>
  body { margin:0; background:#eee; font-family: Arial, sans-serif; padding:20px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .cert {
    position: relative;
    width: 100%;
    aspect-ratio: 2000 / 1414;
    background-image: url('assets/BG-Sertifikat.png');
    background-size: cover;
    background-position: center;
  }
  .field {
    position: absolute;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #111;
    white-space: nowrap;
  }
  .field.right { transform: translate(-100%, -50%); text-align: right; }

  /* Posisi dalam PERSEN, dihitung dari koordinat px asli (2000x1414) */
  .nama-donatur   { left: 50%;   top: 50.9%; font-size: 4.2vw; font-weight: 700; }
  .desk-wakaf     { left: 50%;   top: 63.6%; font-size: 2.6vw; }
  .desk-wakaf .strike { text-decoration: line-through; }
  .jumlah-terbilang{ left: 50%;  top: 67.5%; font-size: 2.6vw; font-weight: 600; }
  .no-sertifikat  { left: 91%;   top: 95.1%; font-size: 1.4vw; color:#555; }
  .tanggal-terbit { left: 91%;   top: 97.2%; font-size: 1.4vw; color:#555; }

  .legend { max-width: 1100px; margin: 16px auto 0; font-size: 13px; color:#333; }
  .legend code { background:#fff; padding:2px 5px; border-radius:3px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="cert">
    <div class="field nama-donatur">SIGIT ARIWIBOWO</div>
    <div class="field desk-wakaf">wakaf air sehat berupa <span class="strike">Barang</span>/Uang</div>
    <div class="field jumlah-terbilang">Lima Ratus Ribu Rupiah</div>
    <div class="field right no-sertifikat">No: CERT/2026/08/00123</div>
    <div class="field right tanggal-terbit">29 Agustus 2026</div>
  </div>
  <div class="legend">
    Kotak teks di atas adalah <b>field dinamis</b> yang akan diisi data transaksi saat generate.
    Nama & jabatan penandatangan sudah tercetak permanen di file background, tidak perlu diisi ulang.
  </div>
</div>
</body>
</html>
